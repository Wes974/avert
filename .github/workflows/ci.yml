name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The web half: typecheck, unit tests, registry sanity, and the network guard.
  # Runs on Linux because none of it needs a Mac — keep the fast feedback fast.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Registry lint
        run: bun run scripts/lint-registry.ts

      - name: Install (ts/)
        working-directory: ts
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: ts
        run: bunx tsc --noEmit

      - name: Unit tests
        working-directory: ts
        run: bun test

      # Bundle here rather than trusting the committed artifacts, then check the
      # freshly built output: a stale committed bundle must not be able to hide a
      # network call that the current sources would introduce.
      - name: Bundle
        working-directory: ts
        run: |
          for entry in content background; do
            bun build "src/$entry.ts" --format=iife --target=browser --minify \
              --outfile="../Extension/Resources/$entry.js"
          done

      - name: Network guard
        run: ./scripts/check-no-network.sh

      - name: Committed bundles are up to date
        run: |
          if ! git diff --quiet -- Extension/Resources; then
            echo "Les bundles committés ne correspondent pas aux sources — relancer ./scripts/build-js.sh" >&2
            git diff --stat -- Extension/Resources
            exit 1
          fi

  # The native half needs an Xcode with the iOS 26 SDK (FoundationModels).
  # Enabled by setting the repository variable ENABLE_MACOS_CI to "true" once a
  # runner image with that Xcode is available; until then the signed builds and
  # the Swift tests run in Xcode Cloud, and this job stays out of the way instead
  # of painting CI red for an infrastructure reason.
  native:
    if: ${{ vars.ENABLE_MACOS_CI == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build & test
        run: |
          xcodebuild test \
            -project Avert.xcodeproj -scheme Avert \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            | xcbeautify

      # visionOS can only be built on Apple silicon: the platform has no x86_64
      # runtime, so `xcodebuild -downloadPlatform visionOS` answers "Could not
      # find platform" on an Intel Mac and no Vision device type ever appears —
      # which makes actool fail on the vision idiom before any Swift is compiled.
      # These runners are ARM, so this is the only machine we have that can
      # answer the question at all.
      #
      # `continue-on-error`: this is an exploration, not a promise. visionOS is
      # not shipped, and a failure here must not paint the iOS pipeline red.
      - name: Build for visionOS (exploratory)
        continue-on-error: true
        run: |
          echo "runner: $(uname -m)"
          xcrun simctl list devicetypes | grep -ci vision || echo "0 vision device type"
          xcodebuild -project Avert.xcodeproj -scheme Avert \
            -destination 'generic/platform=visionOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-xros" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | xcbeautify
