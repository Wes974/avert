<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!--
    Template icon for the "Vérifier ce lien" action extension.

    iOS renders action-extension icons as an ALPHA MASK: every colour is thrown
    away and only opacity survives. That is why the app icon could not be reused —
    it ships without an alpha channel (an App Store requirement), so masking it
    produced the solid white square seen in the share sheet.

    So: black on transparent, no colour, no gradient, and the separation between
    the two cards is a transparent gap rather than a light stroke.

    Same idea as the app icon — "le décalage": a real identity card and its
    offset ghost duplicate.
  -->
  <defs>
    <!-- Knocks a gap out of the ghost card wherever the real card overlaps it,
         since a lighter stroke would simply vanish in a mask. -->
    <mask id="gap">
      <rect width="100" height="100" fill="white"/>
      <rect x="12" y="40" width="58" height="46" rx="13" fill="black"/>
    </mask>
  </defs>

  <!-- Ghost duplicate: outline, offset up and to the right. -->
  <g mask="url(#gap)">
    <rect x="34" y="16" width="52" height="40" rx="9"
          fill="none" stroke="#000" stroke-width="6"/>
  </g>

  <!-- The real card: solid, with the person knocked out so it reads at 20 pt. -->
  <path fill-rule="evenodd" d="
    M 26 44
    h 40
    a 9 9 0 0 1 9 9
    v 26
    a 9 9 0 0 1 -9 9
    h -40
    a 9 9 0 0 1 -9 -9
    v -26
    a 9 9 0 0 1 9 -9
    z
    M 37 62
    a 6.5 6.5 0 1 0 13 0
    a 6.5 6.5 0 1 0 -13 0
    z
    M 32 82
    a 11.5 11.5 0 0 1 23 0
    z
  "/>
</svg>
