<svg xmlns="http://www.w3.org/2000/svg" width="102" height="102" viewBox="14 8 102 102">
  <!--
    Template icon for the "Vérifier ce lien" action extension.

    iOS renders action-extension icons as an ALPHA MASK: every colour is thrown
    away and only opacity survives. That is why the app icon could not be reused —
    it ships without an alpha channel (an App Store requirement), so masking it
    produced the solid white square first seen in the share sheet.

    Same geometry as design/AppIcon.svg, coordinate for coordinate, so the three
    renditions of the mark (Home Screen icon, in-app AvertMark, this one) are one
    drawing. What a mask cannot carry: the gold of the spark, and the indigo of
    the card. The spark stays as a shape; its colour is lost by construction.
  -->
  <defs>
    <!-- The ghost is behind the real card. In the full icon they are separated by
         colour; in a mask everything is the same black, so the gap has to be cut
         out of the ghost explicitly. -->
    <mask id="gap">
      <rect x="0" y="0" width="130" height="130" fill="white"/>
      <rect x="15" y="37" width="50" height="50" rx="16" fill="black"/>
    </mask>
  </defs>

  <!-- Ghost duplicate: dashed card + outlined person, offset up and right. -->
  <g mask="url(#gap)" fill="none" stroke="#000">
    <rect x="44" y="18" width="40" height="40" rx="11" stroke-width="3.6" stroke-dasharray="6 6"/>
    <circle cx="64" cy="34" r="6.2" stroke-width="2.8"/>
    <path d="M53.6 51 a10.4 10.4 0 0 1 20.8 0" stroke-width="2.8"/>
  </g>

  <!-- The real card: solid, person knocked out (evenodd). -->
  <path fill-rule="evenodd" d="
    M 31 42 h 18 a 11 11 0 0 1 11 11 v 18 a 11 11 0 0 1 -11 11
    h -18 a 11 11 0 0 1 -11 -11 v -18 a 11 11 0 0 1 11 -11 z
    M 40 51.6 a 6.4 6.4 0 1 0 0 12.8 a 6.4 6.4 0 1 0 0 -12.8 z
    M 29.6 75 a 10.4 10.4 0 0 1 20.8 0 z
  "/>

  <!-- The spark. Colour is lost in the mask; the shape carries the meaning. -->
  <path fill-rule="evenodd" d="
    M 80 14.4 a 7.6 7.6 0 1 0 0 15.2 a 7.6 7.6 0 1 0 0 -15.2 z
    M 78.7 17.6 h 2.6 v 5.6 h -2.6 z
    M 78.7 25 h 2.6 v 2.4 h -2.6 z
  "/>
</svg>
