name: Avert
options:
  bundleIdPrefix: com.ouweis
  createIntermediateGroups: true
  # French is the source language: the app is written for FR/EU users first, and
  # the String Catalog keys are the French sentences.
  developmentLanguage: fr
  deploymentTarget:
    iOS: "26.0"
    visionOS: "26.0"

settings:
  base:
    # Swift 5 language mode (pas un vieux Swift : Xcode 26.5, toolchain 6.x).
    # Le mode 6 fait planter le region-isolation checker sur la capture de
    # NSExtensionContext dans le Task du handler (« pattern that the checker
    # does not understand how to check. Please file a bug ») — bug compilateur,
    # non contournable proprement, reproduit avec Task et Task.detached.
    # À réessayer à chaque MAJ de Xcode.
    SWIFT_VERSION: "5.0"
    # Ne JAMAIS redescendre ce numéro. Les builds 1 et 2 sont partis en « 1.0 »
    # (valeur figée en dur dans le plist par le bug XcodeGen, cf. plus bas), et
    # les corriger a fait passer les builds suivants en « 0.1.0 » — donc une
    # régression. TestFlight range les builds par version marketing : 1.0 étant
    # supérieur à 0.1.0, il continuait de proposer le build 1 comme le plus
    # récent, et les builds 3 et 4 restaient invisibles aux testeurs alors
    # qu'ils étaient bien distribués et approuvés.
    MARKETING_VERSION: "1.0.1"
    # Valeur de repli uniquement : les envois TestFlight passent par
    # scripts/release-testflight.sh, qui lit le prochain numéro auprès d'App Store
    # Connect et le passe à xcodebuild. Un numéro figé ici serait périmé dès le
    # premier envoi et ferait rejeter le suivant pour doublon.
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: LT9VN8QXU9
    # false : on fournit des Info.plist explicites via les blocs `info:` (requis
    # pour le NSExtension). true entrerait en conflit et rendrait la version
    # imprévisible. Version = source unique MARKETING_VERSION/CURRENT_PROJECT_VERSION.
    GENERATE_INFOPLIST_FILE: false

targets:
  Avert:
    type: application
    supportedDestinations: [iOS, visionOS]
    sources:
      - App
      # Includes Shared/Localizable.xcstrings — every target needs it: the app for
      # its own UI, the extensions because the verdict text is produced there.
      - Shared
    dependencies:
      - target: AvertExtension
        embed: true
      - target: AvertAction
        embed: true
      # Without an explicit link, appintentsmetadataprocessor reports "No
      # AppIntents.framework dependency found" and skips extraction — the intent
      # compiles but never appears in Siri, Spotlight or Shortcuts.
      - sdk: AppIntents.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Avert
        # XcodeGen écrit sinon « 1.0 » et « 1 » EN DUR, en ignorant
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION. Résultat constaté :
        # l'app affichait 1.0 (1) quelle que soit la version réelle.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        # Required, and rejected at upload without it: a universal build
        # (TARGETED_DEVICE_FAMILY 1,2) must declare all four orientations or
        # Apple refuses the bundle for breaking iPad multitasking.
        # "Invalid bundle. No orientations were specified in the com.ouweis.avert
        # bundle." — validation, 2026-07-25.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # On iPhone, upside-down is left out: it is not a rotation anyone wants
        # on a phone, and iOS ignores it on most models anyway.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # Same trap as every `info:` block above, hit a third time: declaring a path
    # makes XcodeGen *generate* the file, silently replacing anything committed
    # there. The content belongs here.
    #
    # Family mode only. Everything else in Avert needs no entitlement at all, and
    # that is worth preserving: these three keys are the entire surface over which
    # anything can ever leave the device. CloudKit carries FamilyAlert records —
    # a timestamp and a device label, no destination (Shared/Family/).
    entitlements:
      path: App/Avert.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.ouweis.avert
        com.apple.developer.icloud-services:
          - CloudKit
        # Silent pushes from a CKSubscription, so a relative learns of an ignored
        # warning without having to open the app.
        aps-environment: development
        # Shared with the Safari extension: the device label lives here, and an
        # access group needs no identifier registered anywhere (unlike an App
        # Group), so it costs nothing to provision.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.ouweis.avert.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ouweis.avert
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AvertExtension:
    type: app-extension
    supportedDestinations: [iOS, visionOS]
    sources:
      - Extension/Swift
      # Shared/UI excluded: this process is spawned for page it analyses, and it
      # never draws anything (the in-page alert is TypeScript). No reason to link
      # SwiftUI views into it.
      - path: Shared
        excludes:
          - "UI"
          - "UI/**"
      - path: Extension/Resources
        buildPhase: resources
        # _locales and images must keep their directory structure in the bundle:
        # the manifest addresses them by path (_locales/<lang>/messages.json,
        # images/icon-48.png). Listed plainly they would be flattened to the
        # bundle root and both references would dangle.
        excludes:
          - "_locales"
          - "_locales/**"
          - "images"
          - "images/**"
      - path: Extension/Resources/_locales
        buildPhase: resources
        type: folder
      - path: Extension/Resources/images
        buildPhase: resources
        type: folder
      - path: registry/brands.json
        buildPhase: resources
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Avert
        # XcodeGen écrit sinon « 1.0 » et « 1 » EN DUR, en ignorant
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION. Résultat constaté :
        # l'app affichait 1.0 (1) quelle que soit la version réelle.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # XcodeGen ne génère pas le bloc NSExtension : obligatoire à la main.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/AvertExtension.entitlements
      properties:
        # The extension publishes the family alert itself: it is the only place
        # that knows the user went through with ignoring the warning.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.ouweis.avert
        com.apple.developer.icloud-services:
          - CloudKit
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.ouweis.avert.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ouweis.avert.extension

  AvertAction:
    type: app-extension
    supportedDestinations: [iOS, visionOS]
    sources:
      - ActionExtension
      - Shared
      # The registry is the reference the verdict compares against — without it
      # in this bundle, every link would come back "nothing found", the most
      # dangerous possible failure. BrandRegistry logs .fault if it's missing.
      - path: registry/brands.json
        buildPhase: resources
    info:
      path: ActionExtension/Info.plist
      properties:
        CFBundleDisplayName: Vérifier ce lien
        # XcodeGen écrit sinon « 1.0 » et « 1 » EN DUR, en ignorant
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION. Résultat constaté :
        # l'app affichait 1.0 (1) quelle que soit la version réelle.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Declared here, not in a hand-written plist: XcodeGen *generates* the file
        # at info.path and silently overwrites anything committed there. Learned
        # twice now — same trap as AvertExtension above.
        NSExtension:
          # ui-services (action), not share-services: an action extension appears
          # in the actions LIST of the share sheet, named by its verb, instead of
          # forcing the user to spot the app's icon among every app that accepts
          # a link. See the header comment in LinkActionViewController.swift.
          NSExtensionPointIdentifier: com.apple.ui-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LinkActionViewController
          NSExtensionAttributes:
            # A predicate rather than NSExtensionActivationSupportsWebURLWithMaxCount:
            # Messages hands a link over as plain text as often as a URL, and the
            # count-based keys ignore the text case — the extension would be absent
            # from the share sheet exactly when a lure message is being read.
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count >= 1).@count == 1'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ouweis.avert.action
        # Its own icon, WITH an alpha channel. iOS renders an action extension's
        # icon as a template — it keeps the transparency and throws the colours
        # away. Falling back to the app icon gave a solid white square in the
        # share sheet, because that one deliberately has no alpha (App Store
        # requirement). See design/ActionIcon.svg.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # --- macOS -----------------------------------------------------------------
  #
  # Separate targets rather than Mac Catalyst. Catalyst would have reused the
  # UIKit surface unchanged, but that surface turned out to be one symbol
  # (`UIApplication.openSettingsURLString`), so its main advantage was worth
  # little — and it buys nothing on the part that actually differs: opening
  # Safari's extension settings. `SFSafariSettings` lands on macOS and Catalyst
  # alike only in 27.0, and `openExtensionsSettings` exists on neither. The Mac
  # answer is `SFSafariApplication.showPreferencesForExtension`, available since
  # 10.12 (see ActivationViews.swift).
  #
  # ActionExtension is deliberately absent: `com.apple.ui-services` is an iOS
  # share-sheet point with no macOS equivalent worth faking.
  AvertMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - App
      - Shared
    dependencies:
      - target: AvertMacExtension
        embed: true
      - sdk: AppIntents.framework
    info:
      path: App/InfoMac.plist
      properties:
        CFBundleDisplayName: Avert
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # No UILaunchScreen and no orientations here: both are iOS keys, and a
        # Mac app that declares them gets nothing but a warning.
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: App/AvertMac.entitlements
      properties:
        # The Mac App Store requires the sandbox. Nothing here needs file or
        # network access — the whole point of Avert — so the sandbox is declared
        # with no exception at all beyond what family mode uses.
        com.apple.security.app-sandbox: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.ouweis.avert
        com.apple.developer.icloud-services:
          - CloudKit
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.ouweis.avert.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ouweis.avert
        # Without this the target name leaks into the product: the menu bar read
        # "AvertMac", which is a build detail, not the name of the app.
        PRODUCT_NAME: Avert
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AvertMacExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Extension/Swift
      - path: Shared
        excludes:
          - "UI"
          - "UI/**"
      - path: Extension/Resources
        buildPhase: resources
        excludes:
          - "_locales"
          - "_locales/**"
          - "images"
          - "images/**"
      - path: Extension/Resources/_locales
        buildPhase: resources
        type: folder
      - path: Extension/Resources/images
        buildPhase: resources
        type: folder
      - path: registry/brands.json
        buildPhase: resources
    info:
      path: Extension/InfoMac.plist
      properties:
        CFBundleDisplayName: Avert
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/AvertMacExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.ouweis.avert
        com.apple.developer.icloud-services:
          - CloudKit
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.ouweis.avert.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ouweis.avert.extension

  AvertTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, visionOS]
    sources:
      - Tests/Swift
      # L1 corpus, shared with the bun tests: both engines assert against the
      # same file so the TS and Swift implementations can't drift apart.
      - path: Tests/corpus
        buildPhase: resources
    dependencies:
      - target: Avert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ouweis.avert.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Avert:
    build:
      targets:
        Avert: all
    test:
      targets:
        - AvertTests
    run: {}

  # No test target yet: AvertTests is an iOS/visionOS bundle. The engine it
  # exercises is platform-free, so a Mac test bundle is worth adding — once the
  # app itself is known to build and run.
  AvertMac:
    build:
      targets:
        AvertMac: all
    run: {}
